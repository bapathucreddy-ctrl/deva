name: Build DEVA Debug APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare sherpa-onnx wake engine
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/libs app/src/main/assets

          curl -fL --retry 3 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar" \
            -o app/libs/sherpa-onnx-1.13.8.aar
          echo "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  app/libs/sherpa-onnx-1.13.8.aar" | sha256sum -c -

          MODEL="sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01"
          curl -fL --retry 3 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/${MODEL}.tar.bz2" \
            -o "/tmp/${MODEL}.tar.bz2"
          tar -xjf "/tmp/${MODEL}.tar.bz2" -C app/src/main/assets

          python3 -m pip install --quiet sentencepiece
          python3 - <<'PY'
          import pathlib, sentencepiece as spm
          model_dir = pathlib.Path("app/src/main/assets/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01")
          sp = spm.SentencePieceProcessor(model_file=str(model_dir / "bpe.model"))
          variants = ["HEY DEVA", "HEY DIVA", "HEY DAYVA", "HEY DEEVA"]
          vocab = {line.split()[0] for line in (model_dir / "tokens.txt").read_text(encoding="utf-8").splitlines()}
          lines = []
          for phrase in variants:
              pieces = sp.encode(phrase, out_type=str)
              if any(piece not in vocab for piece in pieces):
                  raise RuntimeError(f"Unknown model token for {phrase}: {pieces}")
              lines.append(" ".join(pieces) + " :2.0 #0.08 @HEY_DEVA")
          (model_dir / "keywords.txt").write_text(chr(10).join(lines) + chr(10), encoding="utf-8")
          print("Generated keywords:", lines)
          PY

          test -s app/libs/sherpa-onnx-1.13.8.aar
          test -s "app/src/main/assets/${MODEL}/encoder-epoch-12-avg-2-chunk-16-left-64.onnx"
          test -s "app/src/main/assets/${MODEL}/decoder-epoch-12-avg-2-chunk-16-left-64.onnx"
          test -s "app/src/main/assets/${MODEL}/joiner-epoch-12-avg-2-chunk-16-left-64.onnx"
          test -s "app/src/main/assets/${MODEL}/tokens.txt"
          cat "app/src/main/assets/${MODEL}/keywords.txt"

      - name: Create Gradle wrapper
        run: gradle wrapper --gradle-version 8.9
      - name: Core JVM tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Verify APK exists and is non-empty
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK=$APK"
          ls -lh "$APK"
          unzip -t "$APK" >/dev/null
      - name: Inspect package and manifest
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          "$AAPT" dump permissions "$APK" | tee apk-permissions.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > apk-manifest.txt
          grep -q "package: name='com.cclabs.deva'" apk-badging.txt
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DEVA-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Publish verification reports
        uses: actions/upload-artifact@v4
        with:
          name: DEVA-apk-verification
          path: |
            apk-badging.txt
            apk-permissions.txt
            apk-manifest.txt
          retention-days: 7
